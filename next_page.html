<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тігін шеберханасы - Танымдық ойын</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@700;800&display=swap');

    body {
      font-family: 'Nunito', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .placed-item {
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: popIn 0.5s ease-out forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.2); }
      70% { transform: scale(1.15); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes errorShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    .shake-anim {
      animation: errorShake 0.4s ease-in-out;
    }

    .custom-scrollbar::-webkit-scrollbar {
      height: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.4);
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #f59e0b;
      border-radius: 10px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 h-screen w-screen overflow-hidden flex flex-col justify-between select-none">

  <!-- Top Header Navigation -->
  <header class="bg-amber-500/90 backdrop-blur-md text-white p-3 px-6 flex justify-between items-center shadow-lg border-b-4 border-amber-600 z-30">
    <div class="flex items-center gap-3">
      <div class="bg-white p-2 rounded-2xl shadow-inner text-amber-600">
        <i class="fa-solid fa-scissors text-2xl"></i>
      </div>
      <div>
        <h1 class="text-xl md:text-2xl font-black font-['Comfortaa'] tracking-wide">Тігін шеберханасы</h1>
        <p class="text-xs text-amber-100 hidden sm:block">Қажетті құралдарды таңдап, тиісті орынға орналастырыңыз</p>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center gap-3">
      <button id="reset-btn" title="Ойынды қайталау және орындарын ауыстыру" class="bg-blue-500 hover:bg-blue-600 active:scale-95 text-white font-bold py-2.5 px-4 rounded-2xl shadow-md transition-all flex items-center gap-2 border-b-4 border-blue-700 cursor-pointer">
        <i class="fa-solid fa-rotate-right text-lg"></i>
        <span class="hidden md:inline">Қайталау</span>
      </button>

      <button id="next-btn" title="index-1.html бетіне өту" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold py-2.5 px-5 rounded-2xl shadow-md transition-all flex items-center gap-2 border-b-4 border-emerald-700 cursor-pointer">
        <span class="font-bold">Алға</span>
        <i class="fa-solid fa-arrow-left text-lg rotate-180"></i>
      </button>
    </div>
  </header>

  <!-- Main Game Workspace -->
  <main class="relative flex-1 w-full h-full flex items-center justify-center p-2 sm:p-4 overflow-hidden">
    <div id="game-scene" class="relative w-full max-w-6xl aspect-[16/9] rounded-3xl shadow-2xl overflow-hidden border-4 border-amber-400/50 bg-slate-800">
      
      <!-- Background Image: background.png -->
      <img id="bg-img" src="background.png" 
           alt="Тігін шеберханасы" 
           class="w-full h-full object-cover pointer-events-none select-none"
           onerror="this.src='https://placehold.co/1280x720/e2e8f0/1e293b?text=background.png+(Тігін+шеберханасы)';">

      <!-- Targets (Дұрыс орналасатын орындар): -->
      <!-- 1. sewing_machine: Стол үстіне үлкейіп қойылады -->
      <div id="target-sewing_machine" class="absolute top-[48%] left-[28%] -translate-x-1/2 -translate-y-1/2 w-[24%] h-[30%] flex items-center justify-center pointer-events-none z-20"></div>
      
      <!-- 2. scissors: Үлгілердің қасына келеді -->
      <div id="target-scissors" class="absolute top-[20%] right-[20%] w-[12%] h-[18%] flex items-center justify-center pointer-events-none z-20"></div>
      
      <!-- 3. thread: Матаның қасына тұрады -->
      <div id="target-thread" class="absolute top-[50%] left-[58%] w-[12%] h-[16%] flex items-center justify-center pointer-events-none z-20"></div>
      
      <!-- 4. tape_measure: Апайдың қолында болады -->
      <div id="target-tape_measure" class="absolute top-[36%] left-[53%] -translate-x-1/2 w-[16%] h-[20%] flex items-center justify-center pointer-events-none z-20"></div>
      
      <!-- 5. iron: Оң жақ үстел үстінде болады -->
      <div id="target-iron" class="absolute top-[48%] right-[8%] w-[16%] h-[22%] flex items-center justify-center pointer-events-none z-20"></div>

      <!-- Red Error Toast Alert Overlay (Қате деген қызыл хабарлама) -->
      <div id="error-toast" class="absolute top-6 left-1/2 -translate-x-1/2 bg-red-600/90 text-white px-6 py-3 rounded-2xl font-bold shadow-2xl backdrop-blur-md flex items-center gap-3 transition-all duration-300 transform -translate-y-20 opacity-0 pointer-events-none z-40 border-2 border-red-400">
        <i class="fa-solid fa-circle-exclamation text-2xl text-yellow-300"></i>
        <span id="error-text">Қате! Бұл тігіншілік құралы емес!</span>
      </div>

    </div>
  </main>

  <!-- Bottom Panel with PNG items -->
  <footer class="bg-amber-900/90 backdrop-blur-lg border-t-4 border-amber-600 p-3 sm:p-4 z-30">
    <div class="max-w-6xl mx-auto flex flex-col items-center">
      <div id="items-container" class="w-full flex items-center justify-start sm:justify-center gap-3 sm:gap-6 overflow-x-auto custom-scrollbar pb-2 pt-1 px-2">
        <!-- Dynamically loaded item PNG cards -->
      </div>
    </div>
  </footer>

  <!-- Audio elements for sound effects -->
  <audio id="audio-correct" src="correct.mp3" preload="auto"></audio>
  <audio id="audio-wrong" src="wrong.mp3" preload="auto"></audio>

  <script>
    // Массив із сурет атаулары (PNG)
    const itemsData = [
      {
        id: 'sewing_machine',
        name: 'Іс машинкасы',
        isCorrect: true,
        targetId: 'target-sewing_machine',
        file: 'sewing_machine.png'
      },
      {
        id: 'scissors',
        name: 'Қайшы',
        isCorrect: true,
        targetId: 'target-scissors',
        file: 'scissors.png'
      },
      {
        id: 'thread',
        name: 'Жіп',
        isCorrect: true,
        targetId: 'target-thread',
        file: 'thread.png'
      },
      {
        id: 'tape_measure',
        name: 'Өлшеуіш',
        isCorrect: true,
        targetId: 'target-tape_measure',
        file: 'tape_measure.png'
      },
      {
        id: 'iron',
        name: 'Үтік',
        isCorrect: true,
        targetId: 'target-iron',
        file: 'iron.png'
      },
      {
        id: 'ball',
        name: 'Доп',
        isCorrect: false,
        file: 'ball.png'
      },
      {
        id: 'toy_car',
        name: 'Машина',
        isCorrect: false,
        file: 'toy_car.png'
      },
      {
        id: 'doll',
        name: 'Қуыршақ',
        isCorrect: false,
        file: 'doll.png'
      },
      {
        id: 'shovel',
        name: 'Күрек',
        isCorrect: false,
        file: 'shovel.png'
      }
    ];

    let currentItems = [...itemsData];
    let placedState = {};

    // Synthesizer fallback if MP3 files are missing
    const playSynthesizedSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(110, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.4, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch (e) {
        console.log('Audio error handled');
      }
    };

    const playSound = (isCorrect) => {
      const audioEl = document.getElementById(isCorrect ? 'audio-correct' : 'audio-wrong');
      if (audioEl) {
        audioEl.currentTime = 0;
        audioEl.play().catch(() => playSynthesizedSound(isCorrect ? 'correct' : 'wrong'));
      } else {
        playSynthesizedSound(isCorrect ? 'correct' : 'wrong');
      }
    };

    // Random shuffle function
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Show Error Toast Message
    function showErrorToast(msg) {
      const toast = document.getElementById('error-toast');
      const toastText = document.getElementById('error-text');
      toastText.innerText = msg || 'Қате! Бұл тігіншілік құралы емес!';
      
      toast.classList.remove('-translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-20', 'opacity-0');
      }, 2000);
    }

    // Render bottom item cards
    function renderBottomPanel() {
      const container = document.getElementById('items-container');
      container.innerHTML = '';

      currentItems.forEach(item => {
        if (placedState[item.id]) return;

        const itemCard = document.createElement('button');
        itemCard.id = `card-${item.id}`;
        itemCard.className = `flex-shrink-0 w-20 h-20 sm:w-24 sm:h-24 bg-white/90 border-2 border-amber-300 rounded-2xl p-2 flex flex-col items-center justify-between shadow-lg hover:scale-105 active:scale-95 transition-all cursor-pointer group`;
        
        itemCard.innerHTML = `
          <div class="w-12 h-12 sm:w-14 sm:h-14 flex items-center justify-center overflow-hidden">
            <img src="${item.file}" alt="${item.name}" class="w-full h-full object-contain pointer-events-none" onerror="this.src='https://placehold.co/100x100/fef3c7/b45309?text=${encodeURIComponent(item.name)}';">
          </div>
          <span class="text-[11px] sm:text-xs font-black text-slate-700 tracking-tight text-center truncate w-full group-hover:text-amber-700">
            ${item.name}
          </span>
        `;

        itemCard.addEventListener('click', () => handleItemClick(item, itemCard));
        container.appendChild(itemCard);
      });

      // Check win condition
      const correctPlacedCount = itemsData.filter(i => i.isCorrect && placedState[i.id]).length;
      if (correctPlacedCount === 5) {
        setTimeout(() => {
          showErrorToast('Жарайсың! Барлық тігін құралдарын дұрыс таптың! 🎉');
          const toast = document.getElementById('error-toast');
          toast.classList.remove('bg-red-600/90', 'border-red-400');
          toast.classList.add('bg-emerald-600/90', 'border-emerald-400');
        }, 400);
      }
    }

    // Item click logic
    function handleItemClick(item, cardElement) {
      if (item.isCorrect) {
        playSound(true);
        placedState[item.id] = true;

        const targetSpot = document.getElementById(item.targetId);
        if (targetSpot) {
          targetSpot.innerHTML = `
            <div class="w-full h-full flex items-center justify-center filter drop-shadow-2xl hover:scale-110 transition-transform cursor-pointer placed-item" title="${item.name}">
              <img src="${item.file}" alt="${item.name}" class="w-full h-full object-contain pointer-events-none" onerror="this.src='https://placehold.co/100x100/bae6fd/0369a1?text=${encodeURIComponent(item.name)}';">
            </div>
          `;
        }

        renderBottomPanel();

      } else {
        playSound(false);

        // Shake animation & red state
        cardElement.classList.add('shake-anim', 'border-red-500', 'bg-red-100');
        setTimeout(() => {
          cardElement.classList.remove('shake-anim', 'border-red-500', 'bg-red-100');
        }, 500);

        const toast = document.getElementById('error-toast');
        toast.classList.add('bg-red-600/90', 'border-red-400');
        toast.classList.remove('bg-emerald-600/90', 'border-emerald-400');
        showErrorToast(`Қате! ${item.name} бұл тігіншілік құралы емес!`);
      }
    }

    // Reset and shuffle game
    function resetGame() {
      placedState = {};
      itemsData.forEach(item => {
        if (item.targetId) {
          const spot = document.getElementById(item.targetId);
          if (spot) spot.innerHTML = '';
        }
      });
      currentItems = shuffleArray(itemsData);
      renderBottomPanel();
    }

    // Button event listeners
    document.getElementById('next-btn').addEventListener('click', () => {
      window.location.href = 'index-1.html';
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      resetGame();
    });

    window.addEventListener('load', () => {
      resetGame();
    });
  </script>
</body>
</html>
